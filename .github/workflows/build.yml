name: Build Babylon Chat APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # التحقق من مكان gradlew وإعطائه صلاحية التنفيذ
      - name: Verify and Grant Permission to gradlew
        run: |
          if [ -f "./gradlew" ]; then
            echo "✅ Found gradlew in root."
            chmod +x ./gradlew
          else
            echo "❌ ERROR: gradlew is missing!"
            echo "تأكد من رفعه إلى المسار الرئيسي في المستودع."
            exit 1
          fi

      - name: Verify google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "❌ ERROR: app/google-services.json is missing!"
            exit 1
          fi
          echo "✅ google-services.json found."

      # محاولة البناء
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --parallel

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: babylon-chat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
