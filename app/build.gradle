plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.babylon.chat.iq'
    compileSdk 34

    defaultConfig {
        applicationId "com.babylon.chat.iq"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.1"
    }

    signingConfigs {
        babylon {
            storeFile file('babylon-release.keystore')
            storePassword 'kSYJyMZWL8IlXSsaoWRnaBIFLG2clKmz'
            keyAlias 'babylon_key'
            keyPassword 'kSYJyMZWL8IlXSsaoWRnaBIFLG2clKmz'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.babylon
        }
        release {
            signingConfig signingConfigs.babylon
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    // ✅ تم حذف: firebase-database (لم يعد مستخدماً)
}
