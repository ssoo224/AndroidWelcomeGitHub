plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.babylon.chat.iq'
    compileSdk 34

    defaultConfig {
        applicationId "com.babylon.chat.iq"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.1"
    }

    signingConfigs {
        babylon {
            storeFile file('babylon-release.keystore')
            storePassword 'kSYJyMZWL8IlXSsaoWRnaBIFLG2clKmz'
            keyAlias 'babylon_key'
            keyPassword 'kSYJyMZWL8IlXSsaoWRnaBIFLG2clKmz'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.babylon
        }
        release {
            signingConfig signingConfigs.babylon
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    // ✅ تم حذف: firebase-database (لم يعد مستخدماً)
}

// ---- حارس التحجيم الديناميكي (220dp–711dp): يرفض البناء إن أُضيف كود يتجاوزه (انظر DYNAMIC_SCALE.md)
tasks.register('checkDynamicScale') {
    doLast {
        def bad = []
        fileTree(dir: 'src/main/java', include: '**/*.java').each { f ->
            if (f.name == 'ScaledActivity.java' || f.name == 'ScreenScale.java') return
            f.readLines('UTF-8').eachWithIndex { line, i ->
                if (line.contains('scale-ok')) return
                def t = line.trim()
                if (t.startsWith('//') || t.startsWith('*')) return
                if (line =~ /extends\s+(android\.app\.)?(Activity|AppCompatActivity|FragmentActivity)\b/)
                    bad << "${f.name}:${i + 1} الشاشة يجب أن تمتد من ScaledActivity"
                if (line.contains('COMPLEX_UNIT_PX') || line.contains('Resources.getSystem()') || line.contains('getDefaultDisplay()'))
                    bad << "${f.name}:${i + 1} مقاس/كثافة تتجاوز التحجيم (استعمل dp/sp من resources السياق أو ScreenScale.dp)"
            }
        }
        if (!bad.isEmpty()) throw new GradleException('Dynamic scale violations:\n' + bad.join('\n'))
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'checkDynamicScale' }
